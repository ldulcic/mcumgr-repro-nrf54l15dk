# File uploads to LittleFS at /lfs1, on the DK's external flash (see file-upload.overlay).
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_MCUMGR_GRP_FS=y

# 512-byte SMP buffers, so the app uploads about 450 bytes of file data per request. With the
# 2475 bytes of prj.conf, requests are about 2.4 KB and an upload rarely hits the issue.
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=512

CONFIG_BT_DEVICE_NAME="SMP repro files"
